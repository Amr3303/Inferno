<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<html>
<head>
    <title>Pusher Test</title>
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
</head>
<body>
    <div>
        <h2>Pusher Test Client</h2>
        <div id="messages"></div>
    </div>

    <script>
        const pusher = new Pusher('7cc17b8ffe1acd631dea', {
            cluster: 'eu'
        });

        // Replace with your broadcast ID
        const channel = pusher.subscribe('67f86af3b4f8989bb8402f01');
        
        channel.bind('new-message', function(data) {
            const messagesDiv = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.textContent = JSON.stringify(data, null, 2);
            messagesDiv.appendChild(messageEl);
            console.log('Received message:', data);
        });
    </script>
</body>
</html>
